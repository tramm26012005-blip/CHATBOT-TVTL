name: laclac
services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tuvantamly
      POSTGRES_USER: tuvantamly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuvantamly -d tuvantamly"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://tuvantamly:${POSTGRES_PASSWORD}@database:5432/tuvantamly
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN in deploy/.env}
      COOKIE_SECURE: "true"
      PAYMENT_PUBLIC_ORIGIN: https://${DOMAIN}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:8000
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      backend:
        condition: service_healthy
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
